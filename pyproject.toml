[project]
name = "netease-music"
version = "2.0.0"
description = "网易云音乐无损解析工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "bot-duan" }
]

dependencies = [
    "flask>=3.0.3",
    "requests>=2.28.2",
    "cryptography>=40.0.2",
    "mutagen>=1.47.0",
    "qrcode>=8.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
